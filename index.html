<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020713">
  <title>The Solar Expedition</title>
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <main id="panorama" aria-label="The Solar Expedition panorama">
    <div class="stars" aria-hidden="true"></div>
    <div id="scene"></div>
    <nav class="toolbar" aria-label="Experience controls">
      <label><span id="languageLabel" class="sr-only">Language</span><select id="language" aria-label="Language"><option value="en">English</option><option value="fr">Français</option></select></label>
      <label><span id="voiceLabel" class="sr-only">Voice</span><select id="voice" aria-label="Voice"><option value="anna">Anna</option><option value="charles">Charles</option></select></label>
      <button id="sound" type="button" aria-pressed="true">🔊 <span id="soundLabel">Narration on</span></button>
      <button id="music" type="button" aria-label="Play universe music">♪</button>
    </nav>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <audio id="narration" preload="none"></audio>
  <script src="data/catalogue.js?v=8" defer></script>
  <script src="app.js?v=8" defer></script>
  <script src="music.js?v=8" defer></script>
</body>
</html>
